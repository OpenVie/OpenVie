# Prometheus scrape configuration — DEVELOPER stack.
#
# Mounted read-only by the `prometheus` service in docker-compose.yml. In that
# compose file only the data services run in containers; the Spring API (:8080)
# and the FastAPI AI service (:18000) run on the host. `host.docker.internal`
# (mapped via extra_hosts: host-gateway) reaches them from the container.
#
# Production uses `prometheus.yml` with the in-network service DNS names.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: openvie
    environment: development

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: openvie-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: openvie-ai
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:18000']

  # Edge gateway (Apache APISIX) runs as a container in this stack too, so the
  # in-network DNS name is correct. Metrics come from the guarded data-plane
  # route, not the retired :9091 exporter.
  - job_name: openvie-gateway
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: ['apisix:9080']