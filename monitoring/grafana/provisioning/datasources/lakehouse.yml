# Lakehouse & DuckDB Infinity Datasource provisioning (OpenVie).
# Visualizes DuckDB analytical queries, Lakehouse storage KPIs, and Data Quality assertions.
apiVersion: 1

datasources:
  - name: "DuckDB Lakehouse"
    uid: lakehouse-duckdb
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://api:8080/api/v1/analytics/lakehouse
    isDefault: false
    editable: true
    jsonData:
      auth_method: none
