# Alertmanager configuration (OpenVie).
#
# This ships with a single `default` receiver that has NO active integration:
# the operator MUST plug in a delivery address (webhook, email, Slack, ...)
# before alerts can leave the host. Until then alerts are grouped and visible
# in the Alertmanager UI only — nothing is sent anywhere.
#
# Example for a self-hosted webhook bridge (uncomment and set the URL):
#   receivers:
#     - name: default
#       webhook_configs:
#         - url: http://notify.internal.example.com/openvie-alerts
#           send_resolved: true

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  # No webhook/email address is configured yet: this receiver is intentionally
  # delivery-free so the stack boots on a fresh install. The operator adds the
  # real integration here.
  - name: default

# A critical alert for an alertname suppresses the warning version of the same
# alertname until the critical one resolves.
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: ['alertname']