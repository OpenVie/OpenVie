# Edge routes for production containerized deployment (Apache APISIX standalone mode).
#
# Mounted at /usr/local/apisix/conf/apisix.yaml in docker-compose.prod.yml.
# Upstreams resolve to container DNS names (`api` and `frontend`) within the Docker network.
routes:
  # Edge health probe. Answers on the gateway itself.
  - uri: /apisix/status
    name: edge-status
    priority: 100
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function()
              ngx.status = 200
              ngx.header.content_type = "application/json"
              ngx.say("{\"status\": \"pass\"}")
              ngx.exit(200)
            end

  # Unauthenticated surface — installation claim and sign-in.
  - uri: /api/v1/auth/*
    name: edge-auth
    priority: 20
    plugins:
      limit-req:
        key: remote_addr
        rate: 5
        burst: 10
        nodelay: true
        rejected_code: 429
        rejected_msg: "rate limit exceeded at the edge"
    upstream:
      type: roundrobin
      nodes:
        "api:8080": 1

  # Soft admin boundary (Keycloak-ready): owner-only API surface. Same `api`
  # upstream today; own route so the edge can throttle/authorize it
  # independently. Priority 15 keeps /api/v1/admin/* out of the generic API
  # route below.
  - uri: /api/v1/admin/*
    name: edge-admin-api
    priority: 15
    plugins:
      limit-req:
        key: remote_addr
        rate: 20
        burst: 40
        nodelay: true
        rejected_code: 429
        rejected_msg: "rate limit exceeded at the edge"
    upstream:
      type: roundrobin
      nodes:
        "api:8080": 1

  # Headless business API (Spring Boot — Tầng 1).
  - uri: /api/v1/*
    name: edge-api
    priority: 10
    plugins:
      limit-req:
        key: remote_addr
        rate: 50
        burst: 100
        nodelay: true
        rejected_code: 429
        rejected_msg: "rate limit exceeded at the edge"
    upstream:
      type: roundrobin
      nodes:
        "api:8080": 1

  # Admin surface (frontend-admin deployment, OIDC openvie-admin).
  # Priority 5 beats the /* catch-all below without touching API routes.
  - uri: /admin/*
    name: edge-admin-web
    priority: 5
    enable_websocket: true
    upstream:
      type: roundrobin
      pass_host: node
      nodes:
        "frontend-admin:3000": 1

  # Web client (Next.js — Tầng 2).
  - uri: /*
    name: edge-web
    priority: 0
    enable_websocket: true
    upstream:
      type: roundrobin
      pass_host: node
      nodes:
        "frontend:3000": 1
#END
