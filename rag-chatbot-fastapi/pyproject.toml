[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cacanode-ai-api"
version = "0.1.0"
description = "Cacanode chat, retrieval, graph, and ingestion service"
requires-python = ">=3.11,<3.13"
dependencies = [
    "aio-pika==9.6.2",
    "boto3==1.42.94",
    "fastapi==0.136.0",
    "grpcio>=1.71,<2",
    "fastembed==0.8.0",
    "httpx==0.28.1",
    "kuzu==0.11.3",
    "prometheus-client>=0.21,<1",
    "protobuf>=5.29,<6",
    "pypdf==6.4.0",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "polars>=1.30,<2",
    "pyarrow>=19,<24",
    "pydantic-settings==2.14.0",
    "python-multipart==0.0.26",
    "qdrant-client==1.17.1",
    "redis==7.4.0",
    "uvicorn[standard]==0.45.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.71.0",
    "jsonschema>=4.23,<5",
    "mypy>=1.15,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.generated.*"
ignore_errors = true
