name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  license-headers:
    # ASF gate: every authored source file carries the Apache-2.0 header.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 scripts/license_headers.py --check

  dependency-licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 scripts/check_dependency_licenses.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-party-licenses
          path: THIRD_PARTY_LICENSES.md

  artifact-license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: make -C api package
      - run: python3 scripts/check_artifact_licenses.py

  marketplace-validate:
    # Tier-3 guard: bundled marketplace manifests stay schema-valid bizapp.v1
    # (independent of the authoritative Java BizAppManifestValidator, which the
    # java job also enforces via BizAppBundledTemplatesTest).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python3 scripts/marketplace_validate.py

  java:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        # pinned: Redis ≥7.4 is RSALv2/SSPL (not OSI); 7.2.x is BSD-3
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: rag_user
          RABBITMQ_DEFAULT_PASS: rag_password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s
          --health-timeout 5s --health-retries 12
    env:
      REDIS_TEST_URL: redis://localhost:6379/0
      RABBITMQ_TEST_URL: amqp://rag_user:rag_password@localhost:5672/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: make verify
        working-directory: api

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: rag-chatbot-fastapi/pyproject.toml
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[dev]'
          make check
        working-directory: rag-chatbot-fastapi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: |
          npm run lint
          npm run typecheck
          npm run i18n:check
          npm test
          npm run build
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend

