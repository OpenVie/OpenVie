server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: openvie-api
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:20MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:21MB}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_SECONDS:1}s
      timeout: ${REDIS_OPERATION_TIMEOUT_SECONDS:1}s
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,modularReadiness
  health:
    mail:
      # Off by default: a self-hosted install may not run a mail server, and
      # health is checked without opening a SMTP connection. Turn on when a
      # monitored SMTP relay is part of the deployment.
      enabled: ${MAIL_HEALTH_ENABLED:false}

logging:
  level:
    root: INFO
    web: INFO

app:
  # Self-hosted boundary: only the auth routes above and health/info are public.
  # (See bootstrap/config/SecurityConfig for the exact route list.)
  rate-limit:
    enabled: ${PUBLIC_RATE_LIMIT_ENABLED:true}
    public-requests-per-minute: ${PUBLIC_RATE_LIMIT_PER_MINUTE:120}
    # Authenticated traffic (a user JWT or an API key) is metered per
    # tenant+user in Redis, so the same ceiling holds across API instances.
    # Fail-open: API availability never depends on the counter store.
    consumer-requests-per-minute: ${CONSUMER_RATE_LIMIT_PER_MINUTE:600}
  # Signed event push for integrators (API keys authenticate the client; the
  # webhook dispatcher pushes events). Both switches are kill-switches for
  # behavior-changing integration features: disabling them never fails a domain
  # transaction, and pending outbox rows wait for the next restart.
  webhooks:
    enabled: ${WEBHOOKS_ENABLED:true}
    dispatch-interval-ms: ${WEBHOOKS_DISPATCH_INTERVAL_MS:5000}
  security:
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  # Optional caches; all default to off so a fresh install has no unverified
  # optimization enabled.
  cache:
    enabled: ${CACHE_ENABLED:false}
    key-prefix: ${CACHE_KEY_PREFIX:ccn:v2}
    ttl-jitter-percent: ${CACHE_TTL_JITTER_PERCENT:10}
    business-read-enabled: ${BUSINESS_READ_CACHE_ENABLED:false}
    workspace-enabled: ${WORKSPACE_CACHE_ENABLED:false}
    workspace-ttl-seconds: ${WORKSPACE_CACHE_TTL_SECONDS:300}
    user-directory-enabled: ${USER_DIRECTORY_CACHE_ENABLED:false}
    user-directory-ttl-seconds: ${USER_DIRECTORY_CACHE_TTL_SECONDS:30}
    document-list-enabled: ${DOCUMENT_LIST_CACHE_ENABLED:false}
    document-list-ttl-seconds: ${DOCUMENT_LIST_CACHE_TTL_SECONDS:15}
    embedding-enabled: ${EMBEDDING_CACHE_ENABLED:false}
    retrieval-enabled: ${RETRIEVAL_CACHE_ENABLED:false}
  # Mail is optional: "none" boots without any provider. Set MAIL_PROVIDER to
  # smtp plus its credentials as the bootstrap default, or
  # configure per-organization channels in settings (requires
  # NOTIFICATION_ENC_KEY). Invitations minted without an active channel are
  # held in the outbox and replay when one is enabled.
  email:
    provider: ${MAIL_PROVIDER:none}
    from-email: ${FROM_EMAIL:}
    from-name: ${FROM_NAME:OpenVie}
    invitation-link: ${INVITATION_LINK:http://localhost:3000/accept-invitation}
    login-link: ${LOGIN_LINK:http://localhost:3000/login}
    logo-url: ${LOGO_URL:}
  notifications:
    encryption-key: ${NOTIFICATION_ENC_KEY:}
  # Image ingestion (PNG/JPEG/WebP) rides the Python worker's OCR pipeline.
  # Enable this together with INGESTION_OCR_ENABLED on the worker; while it is
  # off, image uploads are rejected up front instead of failing ingestion.
  documents:
    image-uploads-enabled: ${OCR_UPLOADS_ENABLED:false}

