app:
  rate-limit:
    enabled: false
  cors:
    allowed-origin-patterns:
      - "http://localhost:*"
      - "http://127.0.0.1:*"
  security:
    cookie-secure: false
  ai:
    grpc:
      target: localhost:50051
      plaintext: true
  seaweedfs:
    s3-endpoint: http://localhost:8333
    bucket: openvie
    access-key:
    secret-key:
    region: us-east-1
  email:
    from-email: test@test.com
    from-name: OpenVie Test
    invitation-link: http://localhost:3000/accept-invitation

spring:
  config:
    activate:
      on-profile: test
  devtools:
    add-properties: false
  flyway:
    enabled: false
  datasource:
    # MODE=PostgreSQL keeps jsonb/JSON columns faithful; the custom IDENTITY
    # domain exists only because Flowable's H2 task-log schema defines
    # ACT_HI_TSK_LOG.ID_ with the legacy H2 "identity" type, which is not a
    # known data type in PostgreSQL compatibility mode. Task logging stays
    # disabled (engine default), so the plain BIGINT domain is enough.
    url: jdbc:h2:mem:openvie-${random.uuid};MODE=PostgreSQL;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON\;CREATE DOMAIN IF NOT EXISTS IDENTITY AS BIGINT\;CREATE DOMAIN IF NOT EXISTS BLOB AS VARBINARY;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  rabbitmq:
    addresses: ${RABBITMQ_TEST_URL:amqp://guest:guest@localhost:5672/}
    listener:
      simple:
        auto-startup: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  packages-to-scan: com.openvie.api

flowable:
  # The shared in-memory H2 of the test suite IS PostgreSQL-compatible for
  # business tables (see the datasource note above); after adding the IDENTITY
  # domain the engine can create and manage its ACT_* tables there too, so
  # workflow tests run the embedded engine like production does. The async
  # executor stays OFF for plain unit-test contexts: anything that needs
  # timers (SLA escalation) enables it in its own Testcontainers setup.
  process:
    async-executor-activate: false

openapi:
  service:
    api-docs: api
    server: http://localhost:${server.port}
    title: OpenVie API (Test)
    version: 1.0.0

sso:
  enabled: ${SSO_ENABLED:false}
  issuer-uri: ${SSO_ISSUER_URI:http://localhost:18080/realms/openvie}
  frontend-client-id: ${SSO_FRONTEND_CLIENT_ID:openvie-frontend}
  backend-client-id: ${SSO_BACKEND_CLIENT_ID:openvie-backend}
  backend-client-secret: ${SSO_BACKEND_CLIENT_SECRET:}
jwt:
  token-key: ${TOKEN_KEY:test-access-secret}
  expiry-mins: ${EXPIRY_MINS:15}
  expiry-days: ${EXPIRY_DAYS:30}
