<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 265" role="img" aria-label="Quy trình phê duyệt hai cấp với đồng hồ SLA">
  <defs>
    <linearGradient id="af-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>
    <linearGradient id="af-owner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1338"/>
      <stop offset="100%" stop-color="#0e0a1a"/>
    </linearGradient>
    <linearGradient id="af-sla" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1604"/>
      <stop offset="100%" stop-color="#120c02"/>
    </linearGradient>
    <marker id="af-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 z" fill="#1fb6ff"/>
    </marker>
    <marker id="af-arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="af-arrow-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1.5 L8 5 L0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="920" height="265" rx="16" fill="#070a0f"/>

  <!-- Step 0: Submitter -->
  <g transform="translate(25, 25)">
    <rect width="180" height="128" rx="14" fill="url(#af-card)" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="72" y="14" width="36" height="36" rx="9" fill="#1fb6ff" fill-opacity="0.12" stroke="#1fb6ff" stroke-opacity="0.3" stroke-width="1"/>
    <!-- User Icon -->
    <circle cx="90" cy="27" r="5" fill="none" stroke="#1fb6ff" stroke-width="1.8"/>
    <path d="M82 41 c0 -4 3.5 -6 8 -6 s8 2 8 6" fill="none" stroke="#1fb6ff" stroke-width="1.8"/>
    <text x="90" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f5f0">Người nộp</text>
    <text x="90" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94a3b8">Tài liệu / bản ghi</text>
    <text x="90" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#64748b">Khởi tạo quy trình</text>
  </g>

  <!-- Flow 0 -> 1 -->
  <path d="M205 89 H 245" fill="none" stroke="#1fb6ff" stroke-width="1.8" marker-end="url(#af-arrow)"/>

  <!-- Step 1: Workspace Admin -->
  <g transform="translate(245, 25)">
    <rect width="205" height="128" rx="14" fill="url(#af-card)" stroke="#1fb6ff" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="85" y="14" width="36" height="36" rx="9" fill="#1fb6ff" fill-opacity="0.15" stroke="#1fb6ff" stroke-opacity="0.5" stroke-width="1"/>
    <!-- Shield / Admin Icon -->
    <path d="M103 23 l7 3 v6 c0 5 -3.5 8 -7 10 c-3.5 -2 -7 -5 -7 -10 v-6 z" fill="none" stroke="#1fb6ff" stroke-width="1.8"/>
    <text x="102" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f5f0">Cấp 1: Quản trị viên</text>
    <text x="102" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#1fb6ff">Workspace Admin</text>
    <text x="102" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Duyệt · Từ chối · Chuyển tiếp</text>
  </g>

  <!-- Flow 1 -> 2 -->
  <path d="M450 89 H 485" fill="none" stroke="#1fb6ff" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#af-arrow)"/>

  <!-- Step 2: Org Owner -->
  <g transform="translate(485, 25)">
    <rect width="205" height="128" rx="14" fill="url(#af-owner)" stroke="#a855f7" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="85" y="14" width="36" height="36" rx="9" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1"/>
    <!-- Crown / Owner Icon -->
    <path d="M90 38 h24 l2 -12 l-7 5 l-5 -8 l-5 8 l-7 -5 z" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="102" y="74" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#f2f5f0">Cấp 2: Chủ sở hữu</text>
    <text x="102" y="94" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#c084fc">Organization Owner</text>
    <text x="102" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">Hồ sơ mật · Thẩm định cuối</text>
  </g>

  <!-- Outcome Connections (from 690 to 720) -->
  <path d="M690 70 H 706 V 56 H 718" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#af-arrow-ok)"/>
  <path d="M690 108 H 706 V 122 H 718" fill="none" stroke="#f43f5e" stroke-width="1.8" marker-end="url(#af-arrow-no)"/>

  <!-- Outcomes: width expanded to 178px (x=722 to 900) -->
  <!-- Approved -->
  <g transform="translate(722, 28)">
    <rect width="178" height="56" rx="12" fill="#06281e" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="22" cy="28" r="9" fill="#10b981" fill-opacity="0.2"/>
    <path d="M17.5 28 l3 3 l6 -6" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#34d399">ĐÃ PHÊ DUYỆT</text>
    <text x="38" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#a7f3d0">Xuất bản &amp; vector hóa</text>
  </g>

  <!-- Rejected -->
  <g transform="translate(722, 97)">
    <rect width="178" height="56" rx="12" fill="#2d0c13" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="22" cy="28" r="9" fill="#f43f5e" fill-opacity="0.2"/>
    <path d="M17.5 23.5 l9 9 M26.5 23.5 l-9 9" fill="none" stroke="#f43f5e" stroke-width="2" stroke-linecap="round"/>
    <text x="38" y="27" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#fb7185">TỪ CHỐI</text>
    <text x="38" y="43" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#fecdd3">Kèm lý do bắt buộc</text>
  </g>

  <!-- SLA Timer Band -->
  <g transform="translate(25, 172)">
    <rect width="875" height="70" rx="14" fill="url(#af-sla)" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="1.5"/>
    <!-- Timer Icon Badge -->
    <rect x="18" y="15" width="40" height="40" rx="10" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="38" cy="35" r="9" fill="none" stroke="#fbbf24" stroke-width="2"/>
    <path d="M38 29 v6 l4 3" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    
    <!-- SLA Info -->
    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Bộ đếm thời gian SLA tự động (Flowable BPMN Engine)</text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#e2e8f0">
      <tspan fill="#fef08a" font-weight="600">Nhắc nhở sau 24h:</tspan> Tự động phát thông báo khi tác vụ chờ xử lý  ·  
      <tspan fill="#fef08a" font-weight="600">Chuyển tiếp sau 48h:</tspan> Tự chuyển giao lên Chủ sở hữu tổ chức giải quyết điểm nghẽn
    </text>
  </g>
</svg>
